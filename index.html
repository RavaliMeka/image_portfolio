<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Photo Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A photography portfolio: photographs arranged on a sphere you can turn, with an index, a grid and a full-screen viewer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sphere of photographs fills the stage; the statement anchors bottom-left,
   a live field readout (frame, place, exposure) sits bottom-right. */
:root{
  color-scheme:dark;
  --night:#0b0d0e;
  --night-2:#141718;
  --paper:#e6e8e3;
  --faint:rgba(230,232,227,.66);
  --mute:#8a918c;
  --line:rgba(230,232,227,.14);
  --lichen:#c3cd9c;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --st:env(safe-area-inset-top, 0px);
  --sb:env(safe-area-inset-bottom, 0px);
  --ease:cubic-bezier(.2,.7,.2,1);
  --barh:72px;
}
@media (min-width:900px){
  :root{ --gl:max(32px, env(safe-area-inset-left, 0px)); --gr:max(32px, env(safe-area-inset-right, 0px)); }
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; background:var(--night); color:var(--paper); overflow:hidden; }
body{ font:400 15px/1.55 var(--body); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
img{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
a{ color:inherit; -webkit-tap-highlight-color:transparent; }
:focus-visible{ outline:2px solid var(--lichen); outline-offset:3px; border-radius:2px; }
.vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Top bar ---------- */
.bar{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px 16px;
  padding:calc(14px + var(--st)) var(--gr) 14px var(--gl);
  background:linear-gradient(var(--night), rgba(11,13,14,0));
}
.mark{ justify-self:start; display:flex; flex-direction:column; gap:4px; text-align:left; min-height:44px; justify-content:center; }
.mark b{ font:400 21px/1 var(--display); font-variation-settings:"opsz" 48; letter-spacing:-.01em; }
.mark span{ font:400 11px/1.2 var(--mono); color:var(--mute); letter-spacing:.02em; }
.views{ display:flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:999px; background:rgba(11,13,14,.7); }
.views button{ font:500 13px/1 var(--body); padding:0 16px; min-height:38px; border-radius:999px; color:var(--faint); transition:background .3s, color .3s; }
.views button:hover{ color:var(--paper); }
.views button[aria-pressed="true"]{ background:var(--paper); color:var(--night); }
.aboutbtn{ justify-self:end; font:500 13px/1 var(--body); min-height:44px; padding:0 4px; display:flex; align-items:center; gap:10px; }
.aboutbtn i{ width:7px; height:7px; border-radius:50%; background:var(--lichen); }
@media (max-width:640px){
  .bar{ grid-template-columns:1fr auto; }
  .views{ grid-column:1 / -1; grid-row:2; justify-self:stretch; }
  .views button{ flex:1; }
}

/* ---------- Sphere ---------- */
#stage{
  position:fixed; inset:0; z-index:10; overflow:hidden;
  perspective:var(--persp, 1100px);
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  transition:opacity .5s, visibility 0s;
}
#stage.dragging{ cursor:grabbing; }
#world{ position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; will-change:transform; }
.card{
  position:absolute; left:0; top:0; overflow:hidden; border-radius:2px;
  background:var(--night-2); cursor:pointer;
}
.card img{ width:100%; height:100%; object-fit:cover; pointer-events:none; opacity:0; transition:opacity .9s ease, transform .6s var(--ease); }
.card img.in{ opacity:1; }
.card::after{
  content:""; position:absolute; inset:0; pointer-events:none; border-radius:2px;
  background:rgba(6,7,8,var(--d,0)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
}
@media (hover:hover) and (pointer:fine){ .card:hover img{ transform:scale(1.06); } }

/* ---------- Statement and readout ---------- */
.statement{
  position:fixed; left:var(--gl); bottom:calc(24px + var(--sb)); z-index:30;
  width:min(440px, 34vw); pointer-events:none;
  transition:opacity .5s, transform .9s var(--ease);
}
.statement h1{
  margin:0; font:300 clamp(26px, 3vw, 46px)/1.06 var(--display); font-variation-settings:"opsz" 144;
  letter-spacing:-.02em; text-wrap:balance; text-shadow:0 2px 30px rgba(0,0,0,.6);
}
.statement h1 em{ font-style:italic; }
.statement p{ margin:14px 0 0; font:400 11px/1.5 var(--mono); color:var(--mute); letter-spacing:.03em; }
.readout{
  position:fixed; right:var(--gr); bottom:calc(24px + var(--sb)); z-index:30;
  width:min(300px, 26vw); padding-top:12px; border-top:1px solid var(--line);
  display:grid; gap:4px; pointer-events:none; transition:opacity .5s;
}
.readout .rno{ font:500 11px/1.4 var(--mono); color:var(--mute); font-variant-numeric:tabular-nums; display:flex; justify-content:space-between; }
.readout .rt{ font:400 21px/1.15 var(--display); font-variation-settings:"opsz" 48; text-wrap:balance; }
.readout .rp{ font-size:13px; color:var(--faint); }
.readout .rx{ font:400 11px/1.5 var(--mono); color:var(--mute); margin-top:4px; }
body:not(.ready) .statement{ opacity:0; transform:translateY(14px); }
body:not(.ready) .readout{ opacity:0; }
@media (max-width:900px){
  .readout{ display:none; }
  .statement{ width:auto; right:var(--gr); }
}
@media (max-width:640px){
  .statement h1{ font-size:clamp(24px, 7vw, 32px); }
}
@media (max-height:520px) and (orientation:landscape){
  .statement h1{ font-size:22px; }
  .statement p{ display:none; }
}

/* ---------- Index and grid panels ---------- */
.panel{
  position:fixed; inset:0; z-index:20; overflow-y:auto; overscroll-behavior:contain;
  padding:calc(var(--barh) + 28px) var(--gr) calc(56px + var(--sb)) var(--gl);
  opacity:0; visibility:hidden; transition:opacity .45s, visibility 0s .45s;
}
body[data-view="index"] #index, body[data-view="grid"] #grid{ opacity:1; visibility:visible; transition:opacity .45s; }
body:not([data-view="sphere"]) #stage, body:not([data-view="sphere"]) .statement, body:not([data-view="sphere"]) .readout{
  opacity:0; visibility:hidden; transition:opacity .4s, visibility 0s .4s;
}
.panelhead{ max-width:1400px; margin:0 auto 22px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
.panelhead h2{ margin:0; font:300 clamp(30px, 4vw, 54px)/1 var(--display); font-variation-settings:"opsz" 144; letter-spacing:-.02em; }
.panelhead span{ font:400 12px var(--mono); color:var(--mute); }

.list{ list-style:none; margin:0 auto; padding:0; max-width:1400px; border-bottom:1px solid var(--line); }
.row button{
  display:grid; grid-template-columns:44px minmax(0,2.1fr) minmax(0,1.3fr) 52px minmax(0,1.5fr);
  gap:8px 20px; align-items:baseline; width:100%; text-align:left;
  padding:18px 0; border-top:1px solid var(--line);
}
.row .n, .row .y, .row .x{ font:400 12px/1.4 var(--mono); color:var(--mute); font-variant-numeric:tabular-nums; }
.row .t{ font:400 clamp(20px, 2vw, 26px)/1.15 var(--display); font-variation-settings:"opsz" 48; transition:transform .45s var(--ease); }
.row .p{ font-size:14px; color:var(--faint); }
.row button:hover .t, .row button:focus-visible .t{ transform:translateX(8px); }
@media (max-width:760px){
  .row button{ grid-template-columns:32px minmax(0,1fr) 40px; }
  .row .p{ grid-column:2; grid-row:2; font-size:13px; }
  .row .x{ display:none; }
}
#peek{
  position:fixed; left:0; top:0; z-index:25; width:240px; border-radius:2px; overflow:hidden;
  pointer-events:none; opacity:0; transition:opacity .25s; box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#peek.on{ opacity:1; }

.masonry{ columns:3 300px; column-gap:22px; max-width:1400px; margin:0 auto; }
.tile{ display:block; width:100%; break-inside:avoid; margin:0 0 30px; text-align:left; }
.tile .ph{ overflow:hidden; border-radius:2px; background:var(--night-2); }
.tile img{ width:100%; height:auto; transition:transform .9s var(--ease), opacity .9s; opacity:0; }
.tile img.in{ opacity:1; }
.tile:hover img{ transform:scale(1.035); }
.tile .cap{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding-top:10px; }
.tile .cap b{ font:400 16px/1.2 var(--display); font-variation-settings:"opsz" 24; }
.tile .cap span{ font:400 11px/1.3 var(--mono); color:var(--mute); white-space:nowrap; }
@media (max-width:640px){
  .masonry{ columns:2; column-gap:12px; }
  .tile{ margin-bottom:20px; }
  .tile .cap{ flex-direction:column; gap:2px; }
  .tile .cap b{ font-size:14px; }
  .tile .cap span{ white-space:normal; }
}

/* ---------- Viewer ---------- */
#viewer{
  position:fixed; inset:0; z-index:60; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  background:rgba(9,10,11,.97);
  opacity:0; visibility:hidden; transition:opacity .4s, visibility 0s .4s;
}
body.viewing #viewer{ opacity:1; visibility:visible; transition:opacity .4s; }
.vtop{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:calc(10px + var(--st)) var(--gr) 10px var(--gl); }
.vcount{ font:500 12px var(--mono); color:var(--mute); font-variant-numeric:tabular-nums; }
.pill{
  min-height:44px; padding:0 18px; border:1px solid var(--line); border-radius:999px;
  font:500 13px/1 var(--body); display:inline-flex; align-items:center; gap:8px;
  transition:border-color .25s, background .25s;
}
.pill:hover{ border-color:rgba(230,232,227,.5); background:rgba(230,232,227,.05); }
.vbox{ position:relative; display:grid; place-items:center; min-height:0; margin:0 var(--gr) 0 var(--gl); touch-action:pan-y; }
#vimg{ border-radius:2px; transform-origin:0 0; transition:transform .62s var(--ease); background:var(--night-2); box-shadow:0 30px 90px rgba(0,0,0,.6); }
.vmeta{
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) auto; gap:12px 40px; align-items:start;
  padding:18px var(--gr) calc(18px + var(--sb)) var(--gl);
}
.vmeta h2{ margin:0 0 4px; font:400 clamp(22px, 2.2vw, 30px)/1.1 var(--display); font-variation-settings:"opsz" 48; letter-spacing:-.01em; text-wrap:balance; }
.vmeta .vp{ font-size:13px; color:var(--faint); }
.vmeta .vx{ font:400 11px/1.5 var(--mono); color:var(--mute); margin-top:6px; }
.vmeta .vn{ margin:0; font-size:14px; line-height:1.6; color:var(--faint); max-width:62ch; }
.vnav{ display:flex; gap:8px; }
@media (max-width:760px){
  .vmeta{ grid-template-columns:1fr; gap:10px; padding-top:14px; }
  .vmeta .vn{ font-size:13px; }
  .vnav .pill{ flex:1; justify-content:center; }
}
@media (max-height:520px) and (orientation:landscape){
  .vmeta .vn{ display:none; }
  .vmeta{ padding-top:8px; }
}

/* ---------- About drawer ---------- */
#shade{ position:fixed; inset:0; z-index:65; background:rgba(0,0,0,.55); opacity:0; visibility:hidden; transition:opacity .45s, visibility 0s .45s; }
body.about #shade{ opacity:1; visibility:visible; transition:opacity .45s; }
#about{
  position:fixed; top:0; right:0; bottom:0; z-index:70; width:min(460px, 100vw);
  background:var(--night-2); border-left:1px solid var(--line); overflow-y:auto; overscroll-behavior:contain;
  padding:calc(12px + var(--st)) var(--gr) calc(36px + var(--sb)) max(28px, var(--gl));
  transform:translateX(102%); visibility:hidden; transition:transform .6s var(--ease), visibility 0s .6s;
  display:flex; flex-direction:column; gap:28px;
}
body.about #about{ transform:none; visibility:visible; transition:transform .6s var(--ease); }
#about .ahead{ display:flex; justify-content:flex-end; }
#about h2{ margin:0; font:300 40px/1 var(--display); font-variation-settings:"opsz" 144; letter-spacing:-.02em; }
#about .role{ margin:8px 0 0; font:400 12px var(--mono); color:var(--mute); }
#about .bio p{ margin:0 0 12px; color:var(--faint); line-height:1.65; max-width:60ch; }
#about h3{ margin:0 0 10px; font:500 11px var(--mono); letter-spacing:.06em; color:var(--mute); }
#about dl{ margin:0; display:grid; gap:12px; }
#about dt{ font:400 18px/1.2 var(--display); font-variation-settings:"opsz" 24; }
#about dd{ margin:2px 0 0; font-size:14px; color:var(--faint); }
.mail{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.mail output{ font:400 15px var(--mono); user-select:all; -webkit-user-select:all; overflow-wrap:anywhere; }
.links{ display:flex; flex-wrap:wrap; gap:8px; }
.links a{ text-decoration:none; }
.sample{ font:400 11px/1.6 var(--mono); color:var(--mute); border-top:1px solid var(--line); padding-top:14px; }

/* ---------- Loader and intro ---------- */
#loader{
  position:fixed; inset:0; z-index:100; background:var(--night);
  display:flex; flex-direction:column; justify-content:flex-end; gap:18px;
  padding:calc(24px + var(--st)) var(--gr) calc(32px + var(--sb)) var(--gl);
  transition:opacity .7s ease;
}
#loader.done{ opacity:0; pointer-events:none; }
#loader .ln{ font:300 clamp(36px, 6vw, 84px)/1 var(--display); font-variation-settings:"opsz" 144; letter-spacing:-.025em; }
.ticks{ display:flex; flex-wrap:wrap; gap:4px; max-width:100%; }
.ticks i{ width:10px; height:14px; border:1px solid var(--line); border-radius:1px; transition:background .25s, border-color .25s; }
.ticks i.on{ background:var(--paper); border-color:var(--paper); }
#loader .lp{ font:400 12px var(--mono); color:var(--mute); font-variant-numeric:tabular-nums; }
#intro{ position:fixed; inset:0; z-index:90; background:#000; transition:opacity .6s; }
#intro.gone{ opacity:0; pointer-events:none; }
#intro video{ width:100%; height:100%; object-fit:cover; }
#intro .pill{ position:absolute; right:var(--gr); bottom:calc(24px + var(--sb)); background:rgba(0,0,0,.4); }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.12s !important; }
}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="ln" id="loadName"></div>
  <div class="ticks" id="ticks" aria-hidden="true"></div>
  <div class="lp" id="loadLabel">Preparing photographs</div>
</div>

<header class="bar" id="bar">
  <button class="mark" id="mark" type="button"><b id="markName"></b><span id="markRole"></span></button>
  <nav class="views" aria-label="View">
    <button type="button" data-view="sphere" aria-pressed="true">Sphere</button>
    <button type="button" data-view="index" aria-pressed="false">Index</button>
    <button type="button" data-view="grid" aria-pressed="false">Grid</button>
  </nav>
  <button class="aboutbtn" id="aboutBtn" type="button" aria-expanded="false" aria-controls="about"><i aria-hidden="true"></i>About</button>
</header>

<main>
  <div id="stage" aria-label="Photographs arranged on a sphere. Drag to turn it.">
    <div id="world"></div>
  </div>

  <div class="statement" id="statement">
    <h1 id="headline"></h1>
    <p id="statMeta"></p>
  </div>

  <aside class="readout" id="readout" aria-hidden="true">
    <div class="rno"><span id="rNo"></span><span id="rYear"></span></div>
    <div class="rt" id="rTitle"></div>
    <div class="rp" id="rPlace"></div>
    <div class="rx" id="rExif"></div>
  </aside>

  <section class="panel" id="index" aria-label="Index">
    <div class="panelhead"><h2>Index</h2><span id="indexCount"></span></div>
    <ol class="list" id="list"></ol>
  </section>

  <section class="panel" id="grid" aria-label="Grid">
    <div class="panelhead"><h2>Grid</h2><span id="gridCount"></span></div>
    <div class="masonry" id="masonry"></div>
  </section>
</main>

<div id="peek" aria-hidden="true"><img alt="" id="peekImg"></div>

<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vtop">
    <span class="vcount" id="vCount"></span>
    <button class="pill" type="button" id="vClose">Close</button>
  </div>
  <div class="vbox" id="vBox"><img id="vimg" alt=""></div>
  <div class="vmeta">
    <div>
      <h2 id="vTitle"></h2>
      <div class="vp" id="vPlace"></div>
      <div class="vx" id="vExif"></div>
    </div>
    <p class="vn" id="vNote"></p>
    <div class="vnav">
      <button class="pill" type="button" id="vPrev" aria-label="Previous photograph">&larr; Previous</button>
      <button class="pill" type="button" id="vNext" aria-label="Next photograph">Next &rarr;</button>
    </div>
  </div>
</div>

<div id="shade"></div>
<aside id="about" aria-label="About" role="dialog" aria-modal="true">
  <div class="ahead"><button class="pill" type="button" id="aboutClose">Close</button></div>
  <div>
    <h2 id="aName"></h2>
    <p class="role" id="aRole"></p>
  </div>
  <div class="bio" id="aBio"></div>
  <div>
    <h3>Work</h3>
    <dl id="aServices"></dl>
  </div>
  <div>
    <h3>Contact</h3>
    <div class="mail"><output id="aEmail"></output><button class="pill" type="button" id="copyBtn">Copy</button></div>
    <p class="role" id="aLocation"></p>
  </div>
  <div class="links" id="aLinks"></div>
  <p class="sample" id="sampleNote" hidden>Sample photographs are drawn in your browser. Replace them with your own in CONFIG.photos at the bottom of index.html.</p>
</aside>

<script>
/* =====================================================================
   EDIT THIS BLOCK. Everything on the page comes from CONFIG.
   ---------------------------------------------------------------------
   photos[]: each entry is one photograph.
     title, place, year, exif, note   text shown in the readout and viewer
     src     URL or relative path of the full-size image ("photos/01.jpg")
     thumb   optional smaller copy for the sphere and grid (about 800px wide)
     aspect  width / height, e.g. 1.5 for 3:2, 0.667 for 2:3. Detected
             automatically from the image when src is set.
   Leave src empty to show a drawn sample landscape (scene + palette).
   ===================================================================== */
const CONFIG = {
  name: "Iris Calder",
  role: "Landscape and wildlife photographer",
  headline: ["Weather, light and the ", { em: "animals" }, " that move through it."],
  bio: [
    "I photograph remote places in the hours either side of bad weather, usually alone and usually waiting.",
    "Most of these frames came from returning to the same ridge, shoreline or forest edge until the light and the animals agreed."
  ],
  services: [
    ["Editorial", "Assignments for magazines, books and conservation charities."],
    ["Field workshops", "Two small-group trips a year, six people at most."],
    ["Prints", "Archival pigment prints, made to order in three sizes."]
  ],
  email: "hello@iriscalder.example",
  location: "Based in Tromsø, Norway. Working worldwide.",
  links: [
    { label: "Instagram", url: "https://www.instagram.com/" },
    { label: "Print shop", url: "https://example.com/prints" }
  ],
  introVideo: "",     // optional: URL of a short, muted .mp4 played once after loading
  autoRotate: true,   // slow drift when nobody is touching the sphere

  photos: [
    { title:"Cold Front, Late Afternoon", place:"Lofoten, Norway", year:2025, exif:"f/8 · 1/250 s · ISO 200 · 70 mm", note:"The cloud came over the pass in about four minutes. I had time for three frames and a change of gloves.", scene:"ridges", palette:"slate", aspect:1.5 },
    { title:"Low Tide at First Light", place:"Isle of Harris, Scotland", year:2024, exif:"f/11 · 1/60 s · ISO 100 · 35 mm", note:"The tide was going out fast enough that the foreground changed between exposures.", scene:"sea", palette:"dawn", aspect:1.5 },
    { title:"Six Cranes Leaving", place:"Hornborgasjön, Sweden", year:2025, exif:"f/5.6 · 1/2000 s · ISO 800 · 500 mm", note:"They lift off in family groups. I waited for one group small enough to read as a single shape.", scene:"birds", palette:"mist", flock:"v", count:6, aspect:1.5 },
    { title:"Polar Night, 11:40 pm", place:"Senja, Norway", year:2026, exif:"f/2.8 · 8 s · ISO 3200 · 20 mm", note:"Minus nineteen. The batteries lasted forty minutes inside my jacket and twelve outside it.", scene:"aurora", palette:"polar", aspect:0.667 },
    { title:"Erg Chebbi, West Face", place:"Merzouga, Morocco", year:2023, exif:"f/9 · 1/320 s · ISO 100 · 105 mm", note:"Wind had cleared every footprint overnight. By nine the light was too flat to use.", scene:"dunes", palette:"amber", aspect:1.5 },

  world.style.top = cy + "px";
  stage.style.setProperty("--persp", Math.round(Math.max(560, R * 2.8)) + "px");
  stage.style.perspectiveOrigin = `50% ${cy}px`;
  cards.forEach((c, i) => {
    const a = P[i].aspect || 1.5; let w, h;
    if (a >= 1) { w = cw; h = cw / a; } else { h = cw * 1.05; w = h * a; }
    const v = vecs[i];
    c.style.width = w + "px"; c.style.height = h + "px"; c.style.marginLeft = -w / 2 + "px"; c.style.marginTop = -h / 2 + "px";
    c.style.transform = `translate3d(${v.x * R}px,${v.y * R}px,${v.z * R}px) rotateY(${v.lon}deg) rotateX(${v.lat}deg)`;
  });
  if (cur >= 0) fitViewer();
}

/* ---------- Camera loop ---------- */
let yaw = 0, pitch = -8, vYaw = 0, vPitch = 0, camZ = 0, camT = 0;
let dragging = false, hovered = -1, facing = -1, aim = null, viewing = false;
function frame() {
  if (!viewing && body.dataset.view === "sphere") {
    if (aim && !dragging) {
      const dy = ((aim.yaw - yaw) % 360 + 540) % 360 - 180;
      yaw += dy * .12; pitch += (aim.pitch - pitch) * .12;
      if (Math.abs(dy) < .05 && Math.abs(aim.pitch - pitch) < .05) aim = null;
    } else if (!dragging) {
      yaw += vYaw; pitch += vPitch; vYaw *= .94; vPitch *= .94;
      if (Math.abs(vYaw) < .002) vYaw = 0; if (Math.abs(vPitch) < .002) vPitch = 0;
      if (CONFIG.autoRotate && !reduce && hovered < 0 && body.classList.contains("ready")) yaw += .04;
    }
    pitch = clamp(pitch, -50, 50);
  }
  camZ += (camT - camZ) * .07;
  world.style.transform = `translateZ(${camZ.toFixed(2)}px) rotateX(${pitch.toFixed(3)}deg) rotateY(${yaw.toFixed(3)}deg)`;
  const cY = Math.cos(yaw * D), sY = Math.sin(yaw * D), cP = Math.cos(pitch * D), sP = Math.sin(pitch * D);
  let best = -1, bz = -2;
  for (let i = 0; i < N; i++) {
    const v = vecs[i], z1 = -v.x * sY + v.z * cY, z2 = v.y * sP + z1 * cP;
    if (z2 > bz) { bz = z2; best = i; }
    const d = Math.round((1 - Math.pow((z2 + 1) / 2, .8)) * .86 * 100) / 100;
    if (d !== v.d) { v.d = d; cards[i].style.setProperty("--d", d); cards[i].style.pointerEvents = z2 < -.15 ? "none" : ""; }
  }
  if (best !== facing) { facing = best; if (hovered < 0) readout(best); }
  requestAnimationFrame(frame);
}
function readout(i) {
  if (i < 0) return; const p = P[i];
  $("#rNo").textContent = "Frame " + num(i + 1) + " / " + num(N);
  $("#rYear").textContent = p.year || "";
  $("#rTitle").textContent = p.title; $("#rPlace").textContent = p.place; $("#rExif").textContent = p.exif || "";
}

/* ---------- Drag, wheel and keys on the sphere ---------- */
let press = null;
const slop = matchMedia("(pointer: coarse)").matches ? 12 : 6;
stage.addEventListener("pointerdown", e => {
  if (viewing || e.button > 0) return;
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, card: e.target.closest(".card"), moved: false };
  dragging = true; aim = null; vYaw = vPitch = 0;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", e => {
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.lx, dy = e.clientY - press.ly;
  press.lx = e.clientX; press.ly = e.clientY;
  yaw += dx * .18; pitch -= dy * .18; vYaw = dx * .18; vPitch = -dy * .18;
  if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > slop) press.moved = true;
});
const release = (e, click) => {
  if (!press || e.pointerId !== press.id) return;
  const p = press; press = null; dragging = false; stage.classList.remove("dragging");
  if (click && !p.moved) { vYaw = vPitch = 0; if (p.card) openShot(+p.card.dataset.i, p.card); }
};
stage.addEventListener("pointerup", e => release(e, true));
stage.addEventListener("pointercancel", e => release(e, false));
stage.addEventListener("wheel", e => { e.preventDefault(); camT = clamp(camT - e.deltaY * .4, -R * .8, R * .45); }, { passive: false });
cards.forEach((c, i) => {
  c.addEventListener("click", e => { if (e.detail === 0) openShot(i, c); });
  c.addEventListener("pointerenter", () => { if (finePointer) { hovered = i; readout(i); } });
  c.addEventListener("pointerleave", () => { if (hovered === i) { hovered = -1; readout(facing); } });
  c.addEventListener("focus", () => { if (c.matches(":focus-visible")) { aim = { yaw: -vecs[i].lon, pitch: clamp(-vecs[i].lat, -50, 50) }; readout(i); } });
});

/* ---------- Views ---------- */
const VIEWS = ["sphere", "index", "grid"];
function setView(v, write = true) {
  if (!VIEWS.includes(v)) v = "sphere";
  body.dataset.view = v;
  document.querySelectorAll(".views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  if (write) { try { history.replaceState(null, "", "#" + v); } catch (_) {} }
}
document.querySelectorAll(".views button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$("#mark").addEventListener("click", () => setView("sphere"));
addEventListener("hashchange", () => setView(location.hash.slice(1), false));
rows.forEach((b, i) => b.addEventListener("click", () => openShot(i, b)));
tiles.forEach((b, i) => b.addEventListener("click", () => openShot(i, b.querySelector("img"))));

const peek = $("#peek"), peekImg = $("#peekImg");
if (finePointer) {
  rows.forEach((b, i) => {
    b.addEventListener("pointerenter", () => { if (images[i]) { peekImg.src = images[i].thumb; peek.classList.add("on"); } });
    b.addEventListener("pointerleave", () => peek.classList.remove("on"));
  });
  $("#index").addEventListener("pointermove", e => {
    const w = 240, h = peek.offsetHeight || 160;
    const x = Math.min(innerWidth - w - 16, e.clientX + 28), y = clamp(e.clientY - h / 2, 16, innerHeight - h - 16);
    peek.style.transform = `translate3d(${x}px,${y}px,0)`;
  });
  $("#index").addEventListener("scroll", () => peek.classList.remove("on"), { passive: true });
}

/* ---------- Viewer ---------- */
const viewer = $("#viewer"), vimg = $("#vimg"), vbox = $("#vBox");
const mainParts = [$("#bar"), $("main")];
let cur = -1, token = 0, opener = null;
function sourceFor(i) {
  const v = body.dataset.view;
  if (v === "index") return rows[i];
  if (v === "grid") return tiles[i].querySelector("img");
  return vecs[i].d < .55 ? cards[i] : null;
}
function fitViewer() {
  const a = P[cur].aspect || 1.5, bw = vbox.clientWidth, bh = vbox.clientHeight;
  let w = bw, h = bw / a; if (h > bh) { h = bh; w = bh * a; }
  vimg.style.width = Math.floor(w) + "px"; vimg.style.height = Math.floor(h) + "px";
}
function fill(i) {
  const p = P[i], im = images[i];
  vimg.alt = `${p.title}, ${p.place}`;
  if (im) {
    vimg.src = im.thumb;
    if (im.full !== im.thumb) { const t = ++token; loadImg(im.full).then(x => { if (t === token) vimg.src = x.src; }).catch(() => {}); }
  }
  $("#vTitle").textContent = p.title; $("#vPlace").textContent = p.place + (p.year ? " · " + p.year : "");
  $("#vExif").textContent = p.exif || ""; $("#vNote").textContent = p.note || "";
  $("#vCount").textContent = num(i + 1) + " / " + num(N);
}
function flip(from, toHome) {
  if (!from || reduce) return false;
  const a = from.getBoundingClientRect(), b = vimg.getBoundingClientRect();
  if (!a.width || !b.width) return false;
  const t = `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${Math.max(.04, a.width / b.width)},${Math.max(.04, a.height / b.height)})`;
  if (toHome) {
    vimg.style.transition = "none"; vimg.style.transform = t; void vimg.offsetWidth;
    vimg.style.transition = ""; vimg.style.transform = "";
  } else vimg.style.transform = t;
  return true;
}
function openShot(i, from) {
  if (viewing) return;
  opener = document.activeElement; cur = i; viewing = true;
  fill(i); body.classList.add("viewing"); mainParts.forEach(e => e.inert = true);
  fitViewer(); flip(from, true);
  $("#vClose").focus({ preventScroll: true });
}
function closeShot() {
  if (!viewing) return;
  token++; flip(sourceFor(cur), false);
  body.classList.remove("viewing"); mainParts.forEach(e => e.inert = false);
  const back = cur; viewing = false; cur = -1;
  setTimeout(() => { if (!viewing) { vimg.style.transition = "none"; vimg.style.transform = ""; void vimg.offsetWidth; vimg.style.transition = ""; } }, 650);
  const target = body.dataset.view === "index" ? rows[back] : body.dataset.view === "grid" ? tiles[back] : opener;
  if (target && target.focus) target.focus({ preventScroll: true });
}
function go(d) {
  if (!viewing) return;
  cur = (cur + d + N) % N; fill(cur); fitViewer();
  if (!reduce) vimg.animate([{ opacity: 0, transform: `translateX(${d * 24}px)` }, { opacity: 1, transform: "none" }], { duration: 380, easing: "cubic-bezier(.2,.7,.2,1)" });
}
$("#vClose").addEventListener("click", closeShot);
$("#vPrev").addEventListener("click", () => go(-1));
$("#vNext").addEventListener("click", () => go(1));
vbox.addEventListener("click", e => { if (e.target === vbox) closeShot(); });
let swipe = null;
vbox.addEventListener("pointerdown", e => { swipe = { x: e.clientX, y: e.clientY }; });
vbox.addEventListener("pointerup", e => {
  if (!swipe) return; const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? 1 : -1);
});

/* ---------- About ---------- */
function setAbout(on) {
  body.classList.toggle("about", on);
  $("#aboutBtn").setAttribute("aria-expanded", String(on));
  mainParts.forEach(e => e.inert = on);
  (on ? $("#aboutClose") : $("#aboutBtn")).focus({ preventScroll: true });
}
$("#aboutBtn").addEventListener("click", () => setAbout(true));
$("#aboutClose").addEventListener("click", () => setAbout(false));
$("#shade").addEventListener("click", () => setAbout(false));
$("#copyBtn").addEventListener("click", e => {
  const btn = e.currentTarget;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#aEmail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; };
  try {
    navigator.clipboard.writeText(CONFIG.email).then(() => { btn.textContent = "Copied"; }, fallback);
  } catch (_) { fallback(); }
  setTimeout(() => { btn.textContent = "Copy"; }, 2000);
});

/* ---------- Keyboard ---------- */
addEventListener("keydown", e => {
  if (e.key === "Escape") { if (viewing) closeShot(); else if (body.classList.contains("about")) setAbout(false); return; }
  if (viewing) { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); return; }
  if (body.classList.contains("about") || body.dataset.view !== "sphere") return;
  const t = e.target; if (t && t.closest && t.closest("button:not(.card), a, input")) return;
  if (e.key === "ArrowLeft") vYaw -= 1.6; else if (e.key === "ArrowRight") vYaw += 1.6;
  else if (e.key === "ArrowUp") vPitch += 1.2; else if (e.key === "ArrowDown") vPitch -= 1.2;
  else if (e.key === "+" || e.key === "=") camT = clamp(camT + 60, -R * .8, R * .45);
  else if (e.key === "-") camT = clamp(camT - 60, -R * .8, R * .45);
  else return;
  aim = null; e.preventDefault();
});

/* ---------- Resize ---------- */
let lastW = innerWidth, lastH = innerHeight, rq = 0;
const relayout = force => {
  if (!force && Math.abs(innerWidth - lastW) < 20 && Math.abs(innerHeight - lastH) < 20) return;
  lastW = innerWidth; lastH = innerHeight; cancelAnimationFrame(rq); rq = requestAnimationFrame(() => layout());
};
addEventListener("resize", () => relayout(false));
addEventListener("orientationchange", () => setTimeout(() => relayout(true), 220));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());

/* ---------- Load sequence ---------- */
const images = new Array(N);
const ticks = $("#ticks");
for (let i = 0; i < N; i++) ticks.append(el("i"));
function playIntro() {
  return new Promise(res => {
    const v = el("video", { playsinline: true, muted: true, preload: "auto" });
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.src = CONFIG.introVideo;
    const skip = el("button", { class: "pill", type: "button", text: "Skip intro" });
    const wrap = el("div", { id: "intro" }, v, skip);
    let done = false;
    const end = () => { if (done) return; done = true; wrap.classList.add("gone"); setTimeout(() => wrap.remove(), 700); res(); };
    v.addEventListener("ended", end); v.addEventListener("error", end); skip.addEventListener("click", end);
    setTimeout(end, 20000);
    body.append(wrap);
    const p = v.play(); if (p && p.catch) p.catch(() => setTimeout(end, 1200));
  });
}
async function start() {
  const t0 = performance.now();
  layout();
  if (!reduce) { camZ = camT = -R * 1.8; }
  frame();
  noiseTile = makeNoise();
  for (let i = 0; i < N; i++) {
    const p = P[i];
    if (p.src) {
      try { const im = await loadImg(p.thumb || p.src); p.aspect = im.naturalWidth / im.naturalHeight; images[i] = { thumb: im.src, full: p.src }; }
      catch (_) { images[i] = { thumb: paintSample(p, i), full: null }; images[i].full = images[i].thumb; }
    } else {
      const url = paintSample(p, i); images[i] = { thumb: url, full: url };
    }
    const ci = cards[i].querySelector("img"); ci.src = images[i].thumb; ci.classList.add("in");
    const ti = tiles[i].querySelector("img"); ti.src = images[i].thumb; ti.onload = () => ti.classList.add("in");
    ticks.children[i].classList.add("on");
    $("#loadLabel").textContent = "Preparing photograph " + num(i + 1) + " of " + num(N);
    await wait(0);
  }
  if (P.some(p => p.src)) layout();
  await wait(Math.max(0, 1000 - (performance.now() - t0)));
  const intro = CONFIG.introVideo ? playIntro() : null;
  $("#loader").classList.add("done");
  setTimeout(() => $("#loader").remove(), 800);
  if (intro) await intro;
  body.classList.add("ready");
  camT = 0;
}
setView(location.hash.slice(1), false);
start();
})();
</script>
</body>
