<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandeep Komal · Photographs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Landscape, wildflower and nature photography by Sandeep Komal, based in India.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sandeep Komal · Photographs">
<meta property="og:description" content="Landscape, wildflower and nature photography by Sandeep Komal, based in India.">
<meta property="og:url" content="https://ravalimeka.github.io/image_portfolio/">
<meta property="og:image" content="https://ravalimeka.github.io/image_portfolio/photos/lake-pier-sunset.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0d0e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e6e8e3' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23c3cd9c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="ln" id="loadName"></div>
  <div class="ticks" id="ticks" aria-hidden="true"></div>
  <div class="lp" id="loadLabel">Preparing photographs</div>
</div>

<header class="bar" id="bar">
  <button class="mark" id="mark" type="button"><b id="markName"></b><span id="markRole"></span></button>
  <nav class="views" aria-label="View">
    <button type="button" data-view="sphere" aria-pressed="true">Sphere</button>
    <button type="button" data-view="strip" aria-pressed="false">Strip</button>
    <button type="button" data-view="index" aria-pressed="false">Index</button>
    <button type="button" data-view="grid" aria-pressed="false">Grid</button>
  </nav>
  <button class="aboutbtn" id="aboutBtn" type="button" aria-pressed="false"><i aria-hidden="true"></i>About</button>
</header>

<main>
  <div id="stage" aria-label="Photographs arranged on a sphere. Drag to turn it.">
    <div id="world"></div>
  </div>

  <div class="statement" id="statement">
    <h1 id="headline"></h1>
    <p id="statMeta"></p>
    <a class="aboutlink" id="statAbout" href="#about"></a>
  </div>

  <aside class="readout" id="readout" aria-hidden="true">
    <div class="rno"><span id="rNo"></span><span id="rYear"></span></div>
    <div class="rt" id="rTitle"></div>
    <div class="rp" id="rPlace"></div>
    <div class="rx" id="rExif"></div>
  </aside>

  <section class="panel" id="index" aria-label="Index">
    <div class="panelhead"><h2>Index</h2><span id="indexCount"></span></div>
    <div class="chips" id="indexChips" role="group" aria-label="Collections"></div>
    <ol class="list" id="list"></ol>
  </section>

  <section class="strip" id="strip" aria-label="Film strip">
    <div class="track" id="track"></div>
    <div class="scap" aria-live="polite">
      <span class="sno" id="sNo"></span>
      <b id="sTitle"></b>
      <span class="smeta" id="sMeta"></span>
    </div>
    <button class="pill snav sprev" type="button" id="sPrev" aria-label="Previous photograph">&larr;</button>
    <button class="pill snav snext" type="button" id="sNext" aria-label="Next photograph">&rarr;</button>
  </section>

  <section class="panel" id="about" aria-labelledby="aName">
    <div class="aboutpage">
      <figure class="portrait" id="aPortrait"></figure>
      <div class="acopy">
        <p class="eyebrow">About</p>
        <h2 id="aName"></h2>
        <p class="role" id="aRole"></p>
        <p class="lead" id="aLead"></p>
        <div class="bio" id="aBio"></div>
        <dl class="facts" id="aFacts"></dl>
        <section class="asec">
          <h3>Work</h3>
          <dl class="services" id="aServices"></dl>
        </section>
        <section class="asec">
          <h3>Contact</h3>
          <div class="mail"><output id="aEmail"></output><button class="pill" type="button" id="copyBtn">Copy</button><a class="pill" id="aWrite" href="#">Write to me</a></div>
          <p class="role" id="aLocation"></p>
          <div class="links" id="aLinks"></div>
        </section>
        <section class="asec" id="aSelectedSec">
          <h3>Selected work</h3>
          <div class="selected" id="aSelected"></div>
        </section>
        <p class="sample" id="sampleNote" hidden>Sample photographs are drawn in your browser. Replace them with your own in CONFIG.photos in script.js.</p>
      </div>
    </div>
  </section>

  <section class="panel" id="grid" aria-label="Grid">
    <div class="panelhead"><h2>Grid</h2><span id="gridCount"></span></div>
    <div class="chips" id="gridChips" role="group" aria-label="Collections"></div>
    <div class="masonry" id="masonry"></div>
  </section>
</main>

<div id="peek" aria-hidden="true"><img alt="" id="peekImg"></div>

<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="vtop">
    <span class="vcount" id="vCount"></span>
    <div class="vtools">
      <button class="pill" type="button" id="vPlay" aria-pressed="false">Play slideshow</button>
      <button class="pill" type="button" id="vClose">Close</button>
    </div>
  </div>
  <div class="vbox" id="vBox"><div class="vprog" id="vProg" aria-hidden="true"><i></i></div><img id="vimg" alt=""></div>
  <div class="vmeta">
    <div>
      <h2 id="vTitle"></h2>
      <div class="vp" id="vPlace"></div>
      <div class="vx" id="vExif"></div>
      <div class="vact"><a class="pill sm" id="vAsk" href="#">Ask about this photo</a><button class="pill sm" type="button" id="vCopy">Copy link</button></div>
    </div>
    <div class="vmid">
      <p class="vn" id="vNote"></p>
      <dl class="vexp" id="vExp" hidden></dl>
      <div class="vgear" id="vGear" hidden></div>
    </div>
    <div class="vnav">
      <button class="pill" type="button" id="vPrev" aria-label="Previous photograph">&larr; Previous</button>
      <button class="pill" type="button" id="vNext" aria-label="Next photograph">Next &rarr;</button>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
